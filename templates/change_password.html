{% extends 'base.html' %}

{% block title %}Change Password | SNS College{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Change Password</h1>
        <p class="page-subtitle">Update the password for your {{ current_user.role }} account.</p>
    </div>
</div>

<div class="card" style="max-width: 560px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('change_password') }}">
        {{ csrf_field() }}
        <div class="form-group">
            <label class="form-label" for="current_password">Current password</label>
            <input class="form-control" type="password" id="current_password" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="new_password">New password</label>
            <input class="form-control" type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm new password</label>
            <input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-primary" type="submit">Update password</button>
    </form>
</div>
{% endblock %}
